name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install pillow
      - run: unzip -q abagus-apk-ready.zip -d abagus
      - run: npm install --legacy-peer-deps
        working-directory: abagus/native
      - run: npx cap add android
        working-directory: abagus/native
      - run: ./apply-branding.sh
        working-directory: abagus/native
      - run: npx cap sync android
        working-directory: abagus/native
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: abagus/native/android
      - uses: actions/upload-artifact@v4
        with:
          name: Abagus-APK
          path: abagus/native/android/app/build/outputs/apk/debug/app-debug.apk
